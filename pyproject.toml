[project]
name = "memoryledger"
version = "0.1.0"
description = "MemoryLedger — cache-aware memory layout and a per-memory cost ledger for AI agents (repository: Ledge)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests", "ablation"]
# tests/review/ holds the OTHER model's adversarial tests. They are supposed to
# fail until the builder fixes what they found, so they must never be part of the
# builder's own gate. Reviewers run them explicitly: pytest -q tests/review
norecursedirs = ["tests/review", "node_modules", ".venv", "web"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
# tests/review/ holds the OTHER model's adversarial tests. T0.3 kept them out of
# pytest with norecursedirs, but ruff still linted them -- so a reviewer's test
# could turn the BUILDER's gate red, which is the exact inversion tests/review/
# exists to prevent: the builder could not tell "I broke something" from "the
# reviewer filed a finding". Excluding them here completes T0.3's own intent.
# Reviewers run their own tests explicitly: pytest -q tests/review
extend-exclude = ["tests/review"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  # ablation/harness.py:99 and :139 use bare asserts as the leave-one-out
  # GUARANTEE, not as debug scaffolding. No assert-rewriting rule may touch them.
  "B011",
  # The prose in this repo uses em dashes and typographic quotes deliberately.
  "RUF001", "RUF002",
  # zip(strict=) at the eight call sites: strict=False is a no-op, strict=True is
  # a behaviour change with no test coverage. Neither belongs in a lint pass that
  # must end green without changing semantics.
  "B905",
]

[tool.ruff.lint.per-file-ignores]
# 459 of the repo's 464 over-length lines are seeded prose and data literals in
# the student generator; wrapping them would rewrite the seed corpus.
"seed/generate.py" = ["E501"]
# Every over-length line here is a `# VERIFY-WITH-CREDENTIALS:` marker, which Appendix A
# of MemoryLedger-EXECUTE.md says not to reflow.
"ablation/similarity.py" = ["E501"]
# One diagnostic f-string.
"seed/verify.py" = ["E501"]
