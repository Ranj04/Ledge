name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No `run:` step interpolates a github.event.* string, so untrusted event text
# (PR titles, fork branch names) never reaches a shell.

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Pre-warm the tokenizer
        # Without this, every test that counts a token fails with a ProxyError from
        # inside tiktoken rather than an assertion, on any runner that cannot reach
        # openaipublic.blob.core.windows.net. See app/cortex/tokens.py.
        run: python -c "import tiktoken; tiktoken.get_encoding('cl100k_base')"
      - name: Test
        run: python -m pytest -q --ignore=tests/review
      - name: DuckDB ledger, end to end
        # The warehouse-grade backend that needs no account. Migrate a fresh file
        # through the CLI — the path the service takes at startup — then run it
        # again and read the version back: the second run must apply nothing.
        env:
          DUCKDB_PATH: /tmp/ci-ledger.duckdb
        run: |
          python scripts/migrate.py --dialect duckdb
          python scripts/migrate.py --dialect duckdb | grep "schema_migrations at 0002_lifecycle"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
